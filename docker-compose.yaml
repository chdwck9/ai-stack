services:

  hermes-workspace:
    image: ghcr.io/outsourc-e/hermes-workspace:latest
    container_name: ai-hermes-workspace
    restart: unless-stopped
    ports:
      - "7801:3000"
    environment:
      HERMES_HOME: /home/workspace/.hermes
      HERMES_WORKSPACE_DIR: /workspace
      HERMES_API_URL: http://host.docker.internal:8642
      HERMES_DASHBOARD_URL: http://host.docker.internal:9119
      HERMES_API_TOKEN: ${API_SERVER_KEY}
      HERMES_PASSWORD: ${HERMES_WEBUI_PASSWORD}
      COOKIE_SECURE: "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /Users/${USER}/.hermes:/home/workspace/.hermes
      - /Volumes/Live/@Edge/.ai/spaces:/workspace

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ai-open-webui
    restart: unless-stopped
    ports:
      - "7802:8080"
    environment:
      ENABLE_OLLAMA_API: "false"
      OPENAI_API_BASE_URL: http://host.docker.internal:8642/v1
      OPENAI_API_KEY: ${API_SERVER_KEY}
      ANONYMIZED_TELEMETRY: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /Volumes/Live/@Edge/.ai/data/openwebui:/app/backend/data
      - /Volumes/Live/@Edge/.ai/skills:/app/backend/data/open_webui/skills

  searxng:
    image: searxng/searxng:latest
    container_name: ai-searxng
    restart: unless-stopped
    ports:
      - "7803:8080"
    volumes:
      - /Volumes/Live/@Edge/.ai/config/searxng:/etc/searxng
      - /Volumes/Live/@Edge/.ai/data/searxng:/var/cache/searxng

  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: ai-anythingllm
    restart: unless-stopped
    ports:
      - "7805:3001"
    environment:
      STORAGE_DIR: /app/server/storage
    volumes:
      - /Volumes/Live/@Edge/.ai/data/anythingllm:/app/server/storage

  # --- Embeddings: headless llama.cpp server (replaces LM Studio :1234) ---
  # OpenAI-compatible /v1/embeddings on host port 7807. Model file is a copy of
  # LM Studio's bundled nomic-embed-text-v1.5 Q4_K_M (identical vectors, 768d).
  embed:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: ai-embed
    restart: unless-stopped
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "9931"
      - "--embeddings"
      - "--pooling"
      - "mean"
      - "--ctx-size"
      - "8192"
      - "--batch-size"
      - "2048"
      - "--ubatch-size"
      - "2048"
      - "--alias"
      - "nomic-embed-text-v1.5"
      - "-m"
      - "/models/nomic-embed-text-v1.5.Q4_K_M.gguf"
    ports:
      - "7807:9931"
    volumes:
      - /Volumes/Live/@Edge/.ai/models/nomic-embed-text-v1.5:/models:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:9931/health',timeout=2).read()\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  default:
    name: edge-net
    external: true
